[package]
name = "xmip-core-path-index"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-path-index"
description = "Index path technology: reads and writes one field of a delimited text Stream by record and field number, for promote, demote, route and process. A xmip-core-path technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The PathLanguage trait, the content a compiled path
# reads and the rewriting it writes live in path; the error in contract; the
# Stream whose lines are found once in stream. Standard library otherwise:
# delimited text needs no parser.
path = { workspace = true }
contract = { workspace = true }
stream = { workspace = true }
xcore = { workspace = true }

[dev-dependencies]
# The Stream fixture, for the tests only (ADR-0044).
contract = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
